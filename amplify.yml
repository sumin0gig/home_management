version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - mkdir -p build
        - echo "backend-only deployment" > build/index.html
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
